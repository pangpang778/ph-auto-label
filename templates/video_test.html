<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频AI对比测试 - PH</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='video_test.css') }}">
</head>
<body>
    <div class="vt-page">
        <header class="vt-header">
            <div class="vt-brandline">
                <a href="/" class="vt-back"><i class="fas fa-arrow-left"></i> 返回标注</a>
                <span class="vt-kicker">AI VIDEO LAB</span>
            </div>
            <div>
                <h1><i class="fas fa-clapperboard"></i> 视频 AI 四分屏监看台</h1>
                <span class="vt-sub">原声同步 · 四路对比 · 全帧推理输出</span>
            </div>
        </header>

        <div class="vt-layout">
            <aside class="vt-panel">
                <div class="vt-group">
                    <label class="vt-label">1. 选择视频</label>
                    <div class="vt-row">
                        <select id="videoSelect" class="vt-select"></select>
                        <button id="refreshVideosBtn" class="btn btn-secondary" title="刷新列表"><i class="fas fa-sync"></i></button>
                    </div>
                    <button id="uploadBtn" class="btn btn-primary vt-full"><i class="fas fa-upload"></i> 上传视频</button>
                    <input type="file" id="videoFile" accept="video/*" hidden>
                    <div id="uploadMsg" class="vt-hint"></div>
                </div>

                <div class="vt-group">
                    <label class="vt-label">2. 推理引擎</label>
                    <div class="vt-engine">
                        <label class="vt-radio"><input type="radio" name="engine" value="yolo" checked> YOLO</label>
                        <label class="vt-radio"><input type="radio" name="engine" value="sam3"> SAM3</label>
                        <label class="vt-radio"><input type="radio" name="engine" value="vehicle-depth"> 车辆深度跟踪</label>
                    </div>

                    <div id="yoloPanel" class="vt-subpanel">
                        <label class="vt-label">YOLO 模型</label>
                        <select id="yoloModel" class="vt-select"></select>
                    </div>

                    <div id="sam3Panel" class="vt-subpanel" style="display:none;">
                        <label class="vt-label">SAM3 目标类别</label>
                        <input type="text" id="sam3Classes" class="vt-input" placeholder="person,car,dog" value="person,car">
                    </div>

                    <div id="vdPanel" class="vt-subpanel" style="display:none;">
                        <span class="vt-hint">自动检测 car/bus/truck/moto，输出稳定 ID · 距离(m) · 接近/远离速度。权重随仓库内置。</span>
                    </div>
                </div>

                <div class="vt-group">
                    <label class="vt-label">置信度: <span id="confVal">0.35</span></label>
                    <input type="range" id="confRange" min="0.1" max="0.9" step="0.05" value="0.35" class="vt-range">
                </div>

                <button id="startBtn" class="btn btn-success vt-full vt-start"><i class="fas fa-play"></i> 开始全帧推理</button>

                <div id="statusArea" class="vt-status" style="display:none;">
                    <div class="vt-progress"><div id="progressBar" class="vt-progress-bar"></div></div>
                    <div id="statusText" class="vt-status-text"></div>
                </div>

                <div class="vt-control-card">
                    <label class="vt-check"><input type="checkbox" id="syncToggle" checked> 四屏同步播放</label>
                    <label class="vt-label" for="volumeRange">主原声音量: <span id="volumeVal">80%</span></label>
                    <input type="range" id="volumeRange" min="0" max="1" step="0.05" value="0.8" class="vt-range">
                    <button id="quadPlayBtn" class="btn btn-primary vt-full" type="button"><i class="fas fa-play"></i> 同步播放/暂停</button>
                    <span id="syncInfo" class="vt-hint">声音来自左上原视频，其余三屏静音同步。</span>
                </div>

                <div class="vt-note">
                    AI 输出视频会保留原视频音轨；播放时只开左上原声，避免多路声音叠加。四屏会同步播放、暂停、拖动和倍速。
                </div>
            </aside>

            <main class="vt-stage">
                <div class="vt-stage-head">
                    <div>
                        <span class="vt-kicker">QUAD SYNC VIEW</span>
                        <h2>左侧原视频 · 右侧 AI 视频</h2>
                    </div>
                    <span id="aiBadge" class="vt-badge">待生成</span>
                </div>

                <section class="vt-quad" aria-label="四分屏视频对比">
                    <article class="vt-videobox vt-original vt-primary">
                        <div class="vt-videotitle"><span>原视频 A</span><small>主声音源</small></div>
                        <video id="origVideo" controls playsinline></video>
                    </article>
                    <article class="vt-videobox vt-ai vt-primary">
                        <div class="vt-videotitle"><span>AI 视频 A</span><small>检测叠加</small></div>
                        <video id="aiVideo" controls playsinline muted></video>
                    </article>
                    <article class="vt-videobox vt-original">
                        <div class="vt-videotitle"><span>原视频 B</span><small>同步对照</small></div>
                        <video id="origVideoB" playsinline muted></video>
                    </article>
                    <article class="vt-videobox vt-ai">
                        <div class="vt-videotitle"><span>AI 视频 B</span><small>同步对照</small></div>
                        <video id="aiVideoB" playsinline muted></video>
                    </article>
                </section>
            </main>
        </div>
    </div>
    <script src="{{ url_for('static', filename='video_test.js') }}"></script>
</body>
</html>
