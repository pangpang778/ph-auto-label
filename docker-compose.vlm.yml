# Qwen3-VL-4B-Instruct-FP8 inference service - SGLang (same image as docker-compose.la.yml; no vLLM).
# Consumed via OpenAI-compatible API by /api/vlm/status and /api/ai-annotate-vlm(-batch).
# VRAM-exclusive with the LA backend; switching is automated by plugins/vlm_service.py
# ensure_backend (docker start/stop). Usage: docker compose -f docker-compose.vlm.yml up -d
services:
  vlm:
    image: lmsysorg/sglang:latest
    container_name: ph-vlm
    command: >
      python3 -m sglang.launch_server --model-path Qwen/Qwen3-VL-4B-Instruct-FP8
      --served-model-name qwen3-vl-4b
      --trust-remote-code
      --context-length 4096
      --host 0.0.0.0 --port 30000
      --mem-fraction-static 0.72
      --kv-cache-dtype fp8_e4m3
      --cpu-offload-gb 1
    ports:
      - "127.0.0.1:8001:30000"
    environment:
      # Weights load offline from the bind-mounted host HF cache.
      - HF_HUB_OFFLINE=1
    volumes:
      - "C:/Users/Administrator/.cache/huggingface:/root/.cache/huggingface"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
